<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Topología de activos conectados</title>
  <desc id="desc">Diagrama técnico abstracto con equipos conectados a un nodo central.</desc>
  <defs>
    <style>
      .topo-packet { opacity: 0; }
      @media (prefers-reduced-motion: no-preference) {
        .topo-ring { transform-origin: 360px 360px; animation: topo-turn 140s linear infinite; }
        .topo-pulse { transform-origin: 360px 360px; animation: topo-pulse 4.8s cubic-bezier(.16,1,.3,1) infinite; }
        .topo-packet { animation: 5.6s cubic-bezier(.45,0,.55,1) infinite both; }
        .topo-packet--a { animation-name: topo-a; }
        .topo-packet--b { animation-name: topo-b; animation-delay: 1.4s; }
        .topo-packet--c { animation-name: topo-c; animation-delay: 2.8s; }
        .topo-packet--d { animation-name: topo-d; animation-delay: 4.2s; }
        .topo-status { animation: topo-blink 4.8s ease-in-out infinite; }
        @keyframes topo-turn { to { transform: rotate(360deg); } }
        @keyframes topo-pulse { 0% { opacity: .55; transform: scale(.7); } 70%, 100% { opacity: 0; transform: scale(1.35); } }
        @keyframes topo-blink { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
        @keyframes topo-a { 0% { opacity: 0; transform: translate(0, 0); } 12%, 40% { opacity: 1; } 52%, 100% { opacity: 0; transform: translate(188px, -142px); } }
        @keyframes topo-b { 0% { opacity: 0; transform: translate(-134px, 160px); } 12%, 40% { opacity: 1; } 52%, 100% { opacity: 0; transform: translate(0, 0); } }
        @keyframes topo-c { 0% { opacity: 0; transform: translate(0, 0); } 12%, 40% { opacity: 1; } 52%, 100% { opacity: 0; transform: translate(-210px, 0); } }
        @keyframes topo-d { 0% { opacity: 0; transform: translate(224px, 102px); } 12%, 40% { opacity: 1; } 52%, 100% { opacity: 0; transform: translate(0, 0); } }
      }
    </style>
    <pattern id="topo-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6fa2a4" stroke-width="1" opacity=".14"/>
    </pattern>
    <radialGradient id="topo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2e9e97" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2e9e97" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="720" fill="url(#topo-grid)"/>
  <circle cx="360" cy="360" r="300" fill="url(#topo-glow)"/>
  <circle class="topo-ring" cx="360" cy="360" r="248" fill="none" stroke="#7bd3ca" stroke-width="1" opacity=".22" stroke-dasharray="4 10"/>
  <circle cx="360" cy="360" r="156" fill="none" stroke="#7bd3ca" stroke-width="1" opacity=".18"/>
  <g fill="none" stroke="#7bd3ca" stroke-width="1.8" opacity=".6">
    <path d="M360 360 216 208"/>
    <path d="M360 360 548 218"/>
    <path d="M360 360 584 462"/>
    <path d="M360 360 226 520"/>
    <path d="M360 360 356 160"/>
    <path d="M360 360 150 360"/>
    <path d="M360 360 572 342"/>
    <path d="M360 360 344 570"/>
  </g>
  <g fill="#b8e5df">
    <circle class="topo-packet topo-packet--a" cx="360" cy="360" r="3.5"/>
    <circle class="topo-packet topo-packet--b" cx="360" cy="360" r="3.5"/>
    <circle class="topo-packet topo-packet--c" cx="360" cy="360" r="3.5"/>
    <circle class="topo-packet topo-packet--d" cx="360" cy="360" r="3.5"/>
  </g>
  <g fill="#0b2331" stroke="#7bd3ca" stroke-width="2">
    <rect x="548" y="178" width="70" height="52" rx="7"/>
    <rect x="188" y="180" width="62" height="46" rx="6"/>
    <rect x="570" y="432" width="62" height="50" rx="6"/>
    <rect x="196" y="492" width="66" height="48" rx="6"/>
    <rect x="326" y="126" width="66" height="44" rx="6"/>
    <rect x="118" y="330" width="58" height="48" rx="6"/>
    <rect x="546" y="316" width="58" height="48" rx="6"/>
    <rect x="318" y="548" width="58" height="46" rx="6"/>
  </g>
  <g fill="none" stroke="#b8e5df" stroke-width="2" opacity=".8">
    <path d="M560 194h46v14h-46zm0 22h28"/>
    <path d="M204 202h30v10h-30z"/>
    <path d="M582 454h36v12h-36z"/>
    <path d="M210 512h38M210 522h22"/>
    <path d="M340 142h36v8h-36z"/>
    <path d="M132 350h30M132 362h18"/>
    <path d="M560 336h30M560 348h18"/>
    <path d="M332 566h30"/>
  </g>
  <circle class="topo-pulse" cx="360" cy="360" r="96" fill="none" stroke="#7bd3ca" stroke-width="1.5" opacity="0"/>
  <path d="M310 314 360 280l50 34v58l-50 34-50-34v-58Z" fill="#0c2634" stroke="#7bd3ca" stroke-width="2.5"/>
  <path d="M330 348h60v8h-60zm0 18h38v8h-38z" fill="#7bd3ca" opacity=".9"/>
  <circle class="topo-status" cx="360" cy="398" r="8" fill="#e0a44c"/>
  <g fill="#7bd3ca">
    <circle cx="216" cy="208" r="4"/><circle cx="548" cy="218" r="4"/><circle cx="584" cy="462" r="4"/>
    <circle cx="226" cy="520" r="4"/><circle cx="356" cy="160" r="4"/><circle cx="150" cy="360" r="4"/>
    <circle cx="572" cy="342" r="4"/><circle cx="344" cy="570" r="4"/>
  </g>
</svg>
