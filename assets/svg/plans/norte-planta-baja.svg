<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Plano de la planta baja del Edificio Norte</title>
  <desc id="plan-desc">Planta de recepción con mostrador de atención, sala de espera, rincón de impresión, sala técnica con el rack de comunicaciones y acceso principal.</desc>
  <defs>
    <pattern id="np-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2ecea" stroke-width="1"/>
    </pattern>
    <style><![CDATA[
      .wall{fill:none;stroke:#1f3f46;stroke-width:9;stroke-linejoin:round}
      .wall--thin{stroke-width:4;stroke:#7a999c}
      .room{fill:#ffffff;stroke:#c8dad8;stroke-width:2}
      .warm{fill:#f2f6f5;stroke:#c8dad8;stroke-width:2}
      .label{font-family:'IBM Plex Mono',monospace;font-size:21px;letter-spacing:.16em;fill:#33565c}
      .note{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.1em;fill:#7d9a9b}
      .desk{fill:#e6f0ee;stroke:#8fb0ad;stroke-width:2}
      .rack{fill:#d3e6e3;stroke:#4c7b78;stroke-width:3}
      .rack-label{font-family:'IBM Plex Mono',monospace;font-size:15px;fill:#1f3f46;text-anchor:middle}
      .door{stroke:#0d766e;stroke-width:7;stroke-linecap:round}
      .swing{fill:none;stroke:#9dbcb9;stroke-width:2;stroke-dasharray:4 5}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="#f6faf9"/>
  <rect width="1600" height="1000" fill="url(#np-grid)"/>
  <text class="label" x="80" y="62">EDIFICIO NORTE · PLANTA BAJA</text>
  <text class="note" x="1238" y="62">RECEPCIÓN Y ATENCIÓN · ESC. 1:100</text>

  <rect class="room" x="60" y="110" width="1480" height="780" rx="6"/>
  <path class="wall" d="M60 110h1480v780H60z"/>
  <path class="wall--thin" d="M800 180v580M840 180v280M840 500h320M1160 180v580M1200 180h300M1200 460h300M1200 440v320"/>

  <text class="label" x="112" y="172">RECEPCIÓN · LOBBY</text>
  <text class="note" x="866" y="212">SALA DE ESPERA</text>
  <text class="note" x="866" y="536">IMPRESIÓN</text>
  <text class="note" x="1224" y="212">SALA TÉCNICA</text>
  <text class="note" x="1224" y="500">SEGURIDAD</text>
  <text class="note" x="112" y="800">ACCESO PRINCIPAL</text>

  <g>
    <rect class="desk" x="420" y="420" width="260" height="70" rx="8"/>
    <rect class="desk" x="450" y="560" width="160" height="80" rx="6"/>
    <circle cx="530" cy="540" r="24" fill="#ffffff" stroke="#a8c2bf" stroke-width="2"/>
    <rect class="warm" x="180" y="300" width="140" height="60" rx="6"/>
    <rect class="warm" x="180" y="380" width="140" height="60" rx="6"/>
    <rect class="warm" x="640" y="640" width="110" height="60" rx="6"/>
    <text class="note" x="112" y="940">TÓTEM DE VISITAS</text>
    <rect x="660" y="180" width="46" height="120" rx="6" fill="#e6f0ee" stroke="#8fb0ad" stroke-width="2"/>
  </g>

  <g>
    <rect class="warm" x="880" y="240" width="240" height="80" rx="10"/>
    <rect class="warm" x="880" y="360" width="240" height="80" rx="10"/>
    <circle cx="1000" cy="340" r="30" fill="#e6f0ee" stroke="#8fb0ad" stroke-width="2"/>
    <rect x="876" y="552" width="90" height="64" rx="4" fill="#e6f0ee" stroke="#8fb0ad" stroke-width="2"/>
    <rect x="996" y="552" width="90" height="64" rx="4" fill="#e6f0ee" stroke="#8fb0ad" stroke-width="2"/>
    <path d="M876 664h210" stroke="#a8c2bf" stroke-width="3" stroke-dasharray="8 6"/>
  </g>

  <g>
    <rect class="rack" x="1340" y="230" width="110" height="140" rx="4"/>
    <text class="rack-label" x="1395" y="306">RACK N-01</text>
    <path class="door" d="M1200 440h70"/>
    <path class="swing" d="M1200 440a70 70 0 0 0 70 -70"/>
    <rect class="warm" x="1240" y="560" width="240" height="160" rx="6"/>
    <path d="M1270 620h180" stroke="#a8c2bf" stroke-width="8" stroke-linecap="round"/>
    <text class="note" x="1264" y="690">PUESTO DE VIGILANCIA</text>
  </g>

  <g>
    <path d="M700 890v-90h260v90" fill="#f6faf9" stroke="none"/>
    <path class="door" d="M700 890v-90M960 890v-90"/>
    <path d="M830 968v-58" stroke="#0d766e" stroke-width="4" stroke-linecap="round"/>
    <path d="M830 902l-12 18M830 902l12 18" fill="none" stroke="#0d766e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(1466 60)">
    <path d="M14 44V6l-8 10M14 6l8 10" fill="none" stroke="#33565c" stroke-width="3" stroke-linecap="round"/>
    <text class="note" x="-6" y="66">N</text>
  </g>
  <g transform="translate(80 962)">
    <path d="M0 0h100M0 -6v12M100 -6v12" stroke="#7d9a9b" stroke-width="2" stroke-linecap="round"/>
    <text class="note" x="0" y="-12">0</text><text class="note" x="80" y="-12">10 m</text>
  </g>
</svg>
