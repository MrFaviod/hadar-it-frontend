<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Plano del piso 3 del Edificio Central</title>
  <desc id="plan-desc">Planta del estudio de diseño con puestos en isla, sala de revisión, depósito de plotters y terraza.</desc>
  <defs>
    <pattern id="p3-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2ecea" stroke-width="1"/>
    </pattern>
    <style><![CDATA[
      .wall{fill:none;stroke:#1f3f46;stroke-width:9;stroke-linejoin:round}
      .wall--thin{stroke-width:4;stroke:#7a999c}
      .room{fill:#ffffff;stroke:#c8dad8;stroke-width:2}
      .warm{fill:#f2f6f5;stroke:#c8dad8;stroke-width:2}
      .label{font-family:'IBM Plex Mono',monospace;font-size:21px;letter-spacing:.16em;fill:#33565c}
      .note{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.1em;fill:#7d9a9b}
      .desk{fill:#e6f0ee;stroke:#8fb0ad;stroke-width:2}
      .monitor{fill:#cfe2df;stroke:#6f9592;stroke-width:2}
      .chair{fill:#ffffff;stroke:#a8c2bf;stroke-width:2}
      .door{stroke:#0d766e;stroke-width:7;stroke-linecap:round}
      .swing{fill:none;stroke:#9dbcb9;stroke-width:2;stroke-dasharray:4 5}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="#f6faf9"/>
  <rect width="1600" height="1000" fill="url(#p3-grid)"/>
  <text class="label" x="80" y="62">EDIFICIO CENTRAL · PISO 3</text>
  <text class="note" x="1244" y="62">ESTUDIO DE DISEÑO · ESC. 1:120</text>

  <rect class="room" x="60" y="110" width="1480" height="780" rx="6"/>
  <path class="wall" d="M60 110h1480v780H60z"/>
  <path class="wall--thin" d="M880 180v540M920 180v300M1320 180v540M1360 180v540M920 520h400"/>

  <text class="label" x="112" y="172">DISEÑO · ESTUDIO ABIERTO</text>
  <text class="note" x="954" y="212">SALA DE REVISIÓN</text>
  <text class="note" x="954" y="552">DEPÓSITO</text>
  <text class="note" x="1392" y="212">TERRAZA</text>

  <g>
    <rect class="desk" x="200" y="300" width="300" height="80" rx="6"/>
    <rect class="desk" x="200" y="452" width="300" height="80" rx="6"/>
    <rect class="desk" x="580" y="300" width="300" height="80" rx="6"/>
    <rect class="desk" x="580" y="452" width="300" height="80" rx="6"/>
    <rect class="monitor" x="350" y="316" width="56" height="32" rx="3"/>
    <rect class="monitor" x="350" y="468" width="56" height="32" rx="3"/>
    <rect class="monitor" x="730" y="316" width="56" height="32" rx="3"/>
    <rect class="monitor" x="730" y="468" width="56" height="32" rx="3"/>
    <circle class="chair" cx="380" cy="412" r="26"/>
    <circle class="chair" cx="380" cy="564" r="26"/>
    <circle class="chair" cx="760" cy="412" r="26"/>
    <circle class="chair" cx="760" cy="564" r="26"/>
    <rect class="warm" x="200" y="576" width="680" height="120" rx="6"/>
    <text class="note" x="220" y="608">MESA DE CORTE · IMPRESIÓN GRANDE</text>
    <path d="M228 640h620M228 664h620" stroke="#a8c2bf" stroke-width="3"/>
    <rect class="warm" x="160" y="212" width="120" height="60" rx="4"/>
    <text class="note" x="172" y="248">PLOTTER</text>
  </g>

  <g>
    <rect class="warm" x="954" y="250" width="330" height="200" rx="8"/>
    <rect class="chair" x="1010" y="272" width="48" height="28" rx="8"/>
    <rect class="chair" x="1010" y="400" width="48" height="28" rx="8"/>
    <rect class="chair" x="1180" y="272" width="48" height="28" rx="8"/>
    <rect class="chair" x="1180" y="400" width="48" height="28" rx="8"/>
    <path d="M1090 340h90" stroke="#a8c2bf" stroke-width="18" stroke-linecap="round"/>
    <rect x="900" y="560" width="70" height="200" rx="4" fill="#e6f0ee" stroke="#8fb0ad" stroke-width="2"/>
    <path d="M912 600h46M912 640h46M912 680h46" stroke="#a8c2bf" stroke-width="4"/>
    <text class="note" x="1000" y="700">SILLAS · ARCHIVO DE OBRA</text>
    <path class="door" d="M920 520h60"/>
    <path class="swing" d="M920 520a60 60 0 0 0 60 -60"/>
    <rect x="1400" y="220" width="86" height="120" rx="4" fill="url(#p3-grid)" stroke="#a8c2bf" stroke-width="2"/>
    <text class="note" x="1392" y="366">JARDINERA</text>
  </g>

  <g transform="translate(1466 60)">
    <path d="M14 44V6l-8 10M14 6l8 10" fill="none" stroke="#33565c" stroke-width="3" stroke-linecap="round"/>
    <text class="note" x="-6" y="66">N</text>
  </g>
  <g transform="translate(80 946)">
    <path d="M0 0h100M0 -6v12M100 -6v12" stroke="#7d9a9b" stroke-width="2" stroke-linecap="round"/>
    <text class="note" x="0" y="-12">0</text><text class="note" x="80" y="-12">10 m</text>
  </g>
</svg>
