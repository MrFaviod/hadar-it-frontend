<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">Plano de la sala técnica del Data Center</title>
  <desc id="plan-desc">Planta con las zonas frías A y B, la sala de comunicaciones, los racks A-01 a A-04, B-01 a B-03 y COM-01, el pasillo técnico y los equipos de climatización.</desc>
  <defs>
    <pattern id="dc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2ecea" stroke-width="1"/>
    </pattern>
    <pattern id="dc-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#cfe0de" stroke-width="3"/>
    </pattern>
    <style><![CDATA[
      .wall{fill:none;stroke:#1f3f46;stroke-width:9;stroke-linejoin:round}
      .wall--thin{stroke-width:4;stroke:#7a999c}
      .room{stroke:#c8dad8;stroke-width:2;fill:#ffffff}
      .tech{fill:#eef5f4;stroke:#c8dad8;stroke-width:2}
      .label{font-family:'IBM Plex Mono',monospace;font-size:21px;letter-spacing:.16em;fill:#33565c}
      .note{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.1em;fill:#7d9a9b}
      .rack{fill:#d3e6e3;stroke:#4c7b78;stroke-width:3}
      .rack--ups{fill:#e6f1e9;stroke:#7ba28f;stroke-width:3}
      .rack-label{font-family:'IBM Plex Mono',monospace;font-size:17px;fill:#1f3f46;text-anchor:middle}
      .door{stroke:#0d766e;stroke-width:7;stroke-linecap:round}
      .swing{fill:none;stroke:#9dbcb9;stroke-width:2;stroke-dasharray:4 5}
      .zone{fill:#eaf3f2;stroke:#b9d2cf;stroke-width:2;stroke-dasharray:10 8}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="#f6faf9"/>
  <rect width="1600" height="1000" fill="url(#dc-grid)"/>
  <text class="label" x="80" y="62">DATA CENTER · SALA TÉCNICA</text>
  <text class="note" x="1180" y="62">PLANTA BAJA · ESC. 1:100</text>

  <rect class="room" x="60" y="110" width="1480" height="780" rx="6"/>
  <rect class="tech" x="100" y="170" width="600" height="660" rx="4"/>
  <rect class="tech" x="740" y="170" width="460" height="660" rx="4"/>
  <rect class="tech" x="1240" y="170" width="280" height="660" rx="4"/>
  <path class="wall" d="M60 110h1480v780H60z"/>
  <path class="wall--thin" d="M100 170v660M700 170v660M740 170v660M1200 170v660M1240 170v660M1520 170v660"/>
  <text class="label" x="130" y="210">ZONA FRÍA A</text>
  <text class="label" x="770" y="210">ZONA FRÍA B</text>
  <text class="label" x="1268" y="210">COM.</text>

  <g class="racks">
    <rect class="rack" x="170" y="300" width="100" height="180" rx="4"/><text class="rack-label" x="220" y="398">A-01</text>
    <rect class="rack" x="310" y="300" width="100" height="180" rx="4"/><text class="rack-label" x="360" y="398">A-02</text>
    <rect class="rack" x="450" y="300" width="100" height="180" rx="4"/><text class="rack-label" x="500" y="398">A-03</text>
    <rect class="rack" x="590" y="300" width="100" height="180" rx="4"/><text class="rack-label" x="640" y="398">A-04</text>
    <rect class="rack" x="800" y="300" width="100" height="180" rx="4"/><text class="rack-label" x="850" y="398">B-01</text>
    <rect class="rack" x="940" y="300" width="100" height="180" rx="4"/><text class="rack-label" x="990" y="398">B-02</text>
    <rect class="rack" x="1080" y="300" width="100" height="180" rx="4"/><text class="rack-label" x="1130" y="398">B-03</text>
    <rect class="rack" x="1280" y="300" width="86" height="220" rx="4"/><text class="rack-label" x="1323" y="418">COM-01</text>
    <rect class="rack" x="1400" y="300" width="86" height="220" rx="4"/><text class="rack-label" x="1443" y="418">COM-02</text>
  </g>

  <g>
    <rect class="zone" x="460" y="520" width="240" height="120" rx="6"/>
    <text class="note" x="480" y="552">UPS · PDU</text>
    <rect class="rack--ups" x="480" y="570" width="90" height="52" rx="4"/>
    <rect class="rack--ups" x="586" y="570" width="90" height="52" rx="4"/>
    <rect class="zone" x="840" y="520" width="300" height="120" rx="6"/>
    <text class="note" x="860" y="552">BACKUP · ALMACENAMIENTO</text>
    <rect class="rack--ups" x="870" y="570" width="110" height="52" rx="4"/>
    <rect class="rack--ups" x="1000" y="570" width="110" height="52" rx="4"/>
    <rect class="zone" x="820" y="680" width="300" height="110" rx="6"/>
    <text class="note" x="840" y="712">VIRTUALIZACIÓN · CPD</text>
  </g>

  <g>
    <rect x="112" y="404" width="34" height="180" rx="4" fill="url(#dc-hatch)" stroke="#9dbcb9" stroke-width="2"/>
    <text class="note" x="112" y="616" transform="rotate(-90 112 616)">CRAC 1</text>
    <rect x="1454" y="560" width="34" height="200" rx="4" fill="url(#dc-hatch)" stroke="#9dbcb9" stroke-width="2"/>
    <text class="note" x="1512" y="700" transform="rotate(-90 1512 700)">CRAC 2</text>
  </g>

  <rect x="60" y="890" width="1480" height="70" fill="#eaf3f2" stroke="#c8dad8"/>
  <text class="note" x="90" y="932">PASILLO TÉCNICO · ACCESO RESTRINGIDO</text>
  <path class="door" d="M760 890h120"/>
  <path class="swing" d="M760 890a120 120 0 0 1 120 120"/>
  <path class="wall--thin" d="M100 890v70M1200 890v70"/>

  <g transform="translate(1466 60)">
    <path d="M14 44V6l-8 10M14 6l8 10" fill="none" stroke="#33565c" stroke-width="3" stroke-linecap="round"/>
    <text class="note" x="-6" y="66">N</text>
  </g>
  <g transform="translate(80 850)">
    <path d="M0 0h80M0 -6v12M80 -6v12" stroke="#7d9a9b" stroke-width="2" stroke-linecap="round"/>
    <text class="note" x="0" y="-14">0</text><text class="note" x="62" y="-14">5 m</text>
  </g>
</svg>
