pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/geo+json;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Upstream names are containers that may not exist yet: the frontend serves
    # the setup wizard while the API and the setup service are still absent.
    # Docker DNS is resolved per request (valid=10s) instead of once at boot, so
    # a late upstream is picked up without restarting the edge. ipv6=off drops
    # AAAA answers that would otherwise time out on this IPv4-only network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Diagnostic policy only: Vue runtime compilation can report eval violations.
        # Do not add unsafe-eval or promote this policy to enforcement here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        # The current HTTP edge owns these headers (including upstream errors).
        # Preserve resource-specific enforcing CSP from the backend unchanged.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy-Report-Only;
        location /assets/ { expires epoch; }
        location / { try_files $uri $uri/ =404; }
        # A variable proxy_pass is resolved at request time. Without a URI part
        # in the variable, nginx sends the request untouched; $request_uri keeps
        # the original path and query exactly as the browser wrote it.
        # A missing upstream answers 502/503 and never falls back to /index.html.
        location /api/setup/v1/ {
            set $setup_upstream http://setup:8100;
            proxy_pass $setup_upstream$request_uri;
            # The wizard validates Origin against the public authority it was
            # reached through. $host drops the port, which makes an unlisted
            # installation reject its own same-origin claim (origin_not_allowed).
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 130s;
            proxy_buffering off;
        }
        location /api/ {
            set $api_upstream http://backend:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 130s;
            proxy_buffering off;
        }
    }
}
